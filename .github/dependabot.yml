version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # eslint 10 and @eslint/js 10: eslint-plugin-jsx-a11y@6 only supports eslint <= 9 (npm ci fails with ERESOLVE).
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # typescript 7: typescript-eslint@8 only supports typescript < 6.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Forge runtime and .nvmrc are Node 24; do not type against a newer Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      forge:
        patterns: ['@forge/*']
        update-types: [minor, patch]
      tiptap-prosemirror:
        patterns: ['@tiptap/*', 'prosemirror-*']
        update-types: [minor, patch]
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript*',
            'prettier',
            'vitest',
            '@vitest/*',
            '@playwright/*',
          ]
        update-types: [minor, patch]
      # Catch-all for the remaining direct dependencies; major bumps stay as individual PRs.
      npm-other:
        patterns: ['*']
        update-types: [minor, patch]
      # One PR for all security fixes, including transitive dependencies.
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
