name: Branch name

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: ['**']

permissions: {}

jobs:
  branch-name:
    # Dependabot cannot choose its branch names (dependabot/<ecosystem>/...), so its PRs are exempt.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout on purpose: a pull request must not be able to alter the rule that judges it.
      - name: Validate branch name
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          node -e '
            const re = new RegExp(String.raw`^(main|dev|((feat|fix|hotfix|refactor)\/[0-9]+-[a-zA-Z0-9][a-zA-Z0-9._-]*)|(release|chore|docs|test|ci|build)\/[a-zA-Z0-9][a-zA-Z0-9._-]*)\n?$`);
            const name = process.env.BRANCH ?? "";
            if (!re.test(name)) {
              console.error("Invalid branch name: " + name);
              console.error("Allowed: main | dev | (feat|fix|hotfix|refactor)/<issue-number>-<description> | (release|chore|docs|test|ci|build)/<description>");
              console.error("See CONTRIBUTING.md#branch-names");
              process.exit(1);
            }
            console.log("Branch name OK: " + name);
          '
